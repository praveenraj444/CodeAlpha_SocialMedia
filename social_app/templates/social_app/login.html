{% extends 'social_app/base.html' %}
{% block title %}Login — CodeAlpha Social{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-logo brand-gradient">CodeAlpha</div>
        <p class="auth-subtitle">Log in to your account</p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                Log In
            </button>
        </form>

        <div class="divider-or my-4">OR</div>

        <p class="text-center mb-0">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}

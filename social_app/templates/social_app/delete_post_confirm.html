{% extends 'social_app/base.html' %}
{% block title %}Delete Post — CodeAlpha Social{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container text-center">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        <h4 class="mt-3">Delete Post?</h4>
        <p class="text-muted">This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 py-2">Yes, Delete</button>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 py-2 mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

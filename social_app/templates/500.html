{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Server Error — CodeAlpha Social</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin: 0;
        }
        .error-box { text-align: center; padding: 40px; }
        .error-code { font-size: 8rem; font-weight: 900; line-height: 1; }
        .error-msg { font-size: 1.5rem; margin: 20px 0; font-weight: 600; }
        .btn-home {
            background: #fff; color: #f5576c; font-weight: 700;
            padding: 12px 32px; border-radius: 10px;
            text-decoration: none; display: inline-block;
            margin-top: 20px; transition: transform 0.3s ease;
        }
        .btn-home:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">500</div>
        <div class="error-msg">Something went wrong</div>
        <p>Our server is having a small issue. Please try again.</p>
        <a href="/" class="btn-home">Go Home</a>
    </div>
</body>
</html>
